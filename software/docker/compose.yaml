# On the robot: docker compose -f software/docker/compose.yaml up -d
# CAN (can0 or vcan0) is set up on the host; host networking lets the container use it,
# and keeps DDS and foxglove_bridge simple.
#
# nofile: Docker's default open-files limit is about 2^30, and LTTng (loaded by every ROS 2
# process through tracetools) keeps a bitmap sized by it: 128 MB of RAM per process.
x-common: &common
  image: vector
  network_mode: host
  ipc: host
  ulimits:
    nofile: 65536

services:
  robot:
    <<: *common
    cap_add: [SYS_NICE]
    ulimits:
      nofile: 65536
      rtprio: 99
      memlock: -1
    environment:
      - CAN_INTERFACE=${CAN_INTERFACE:-can0}
      - GNSS_PORT=${GNSS_PORT:-}
      - IO_PORT=${IO_PORT:-}
      - IMU=${IMU:-false}
      - NAV=${NAV:-false}
      - LINKS=${LINKS:-false}
      - ELRS_PORT=${ELRS_PORT:-}
      - LTE_AT_PORT=${LTE_AT_PORT:-}
    # UARTs (GNSS, ELRS: ttyAMA*, major 204), the nose board's I2C (i2c-*, 89) and the LTE
    # modem's AT port (ttyUSB*, 188), without failing when they aren't there
    volumes: [/dev:/dev]
    device_cgroup_rules: ['c 204:* rmw', 'c 89:* rmw', 'c 188:* rmw']
    command: >
      bash -c "ros2 launch vector_bringup robot.launch.py hardware:=can can_interface:=$${CAN_INTERFACE}
      $${GNSS_PORT:+gnss_port:=$${GNSS_PORT}} $${IO_PORT:+io_port:=$${IO_PORT}} imu:=$${IMU} nav:=$${NAV} links:=$${LINKS}
      $${ELRS_PORT:+elrs_port:=$${ELRS_PORT}} $${LTE_AT_PORT:+lte_at_port:=$${LTE_AT_PORT}} rviz:=false"
    restart: unless-stopped

  foxglove:
    <<: *common
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml
    restart: unless-stopped

  # RTSP / WebRTC / HLS server: rtsp://<robot>:8554/<path>, http://<robot>:8889/<path> in a browser
  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: host
    restart: unless-stopped

  # YOLO on the camera; the camera itself runs on the host (vector-camera.service from
  # software/host/setup.sh). Inference on a 320 px copy, masks and stream at the full size.
  vision:
    <<: *common
    image: vector-vision
    profiles: [vision]
    # ONNX models in the models volume, made once by the export image (software/vision/Dockerfile)
    command: python3 yolo_node.py --ros-args -p model:=models/${YOLO_MODEL:-yolo26n-seg-320.onnx} -p width:=${CAMERA_WIDTH:-640} -p height:=${CAMERA_HEIGHT:-480} -p stream:=rtsp://127.0.0.1:8554/yolo
    volumes: [models:/ws/vision/models]
    restart: unless-stopped

  # six simulated legs on vcan0, for testing without hardware: --profile sim
  sim_legs:
    <<: *common
    profiles: [sim]
    command: bash -c "/ws/install/vector_hw/lib/vector_hw/sim_legs vcan0 --calibrated --limits -45.8,45.8,-80.2,80.2,-149,17"

  # the power board with a draining battery; ends when it switches itself off
  sim_power:
    <<: *common
    profiles: [sim]
    command: /ws/install/vector_hw/lib/vector_hw/sim_power vcan0

volumes:
  models:
