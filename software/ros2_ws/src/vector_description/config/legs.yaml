# Leg geometry, metres and radians, from the Fusion 360 model (tools/cad_urdf.py prints these
# after every export). Leg frame: origin at the coxa axis, x pointing outward, z up.
coxa: 0.051
femur: 0.0676
tibia: 0.1186

# the two body plates; the coxa servo mounts outside them count as legs
body: {length: 0.192, width: 0.110, thickness: 0.04}

# Hip (coxa axis) position in base_link and the leg's mounting yaw.
mounts:
  L1: {x: 0.1142, y: 0.0631, yaw: 0.7854}
  L2: {x: 0.0, y: 0.0967, yaw: 1.5708}
  L3: {x: -0.1142, y: 0.0631, yaw: 2.3562}
  R1: {x: 0.1142, y: -0.0631, yaw: -0.7854}
  R2: {x: 0.0, y: -0.0967, yaw: -1.5708}
  R3: {x: -0.1142, y: -0.0631, yaw: -2.3562}

limits:
  coxa: [-0.8, 0.8]
  femur: [-1.4, 1.4]
  tibia: [-2.6, 0.3]
  velocity: 7.0   # MG996R at 6 V, roughly 0.14 s / 60 deg
  effort: 1.08    # N·m, MG996R stall at 6 V (11 kg·cm)

# Neutral stance: foot distance from the hip (horizontal) and hip height above ground.
# From a gait_report sweep at 3 kg: every joint keeps 10 deg from its limits in all gaits; a
# longer reach costs femur torque, a lower hip runs the femur and tibia into their limits.
stand:
  reach: 0.108
  height: 0.100

# Mass estimates, kg (3.0 kg total). Coxa servos, battery and electronics sit in the body;
# the femur servo rides on the coxa link, the tibia servo on the femur link.
mass:
  body: 1.83
  coxa_link: 0.075
  femur_link: 0.080
  tibia_link: 0.040

foot_friction: 0.9   # TPU on dirt/wood, rough guess

# VL53L1X on the tibia, in front of the leg (the CAD's ToF front plate): in the tibia link
# frame (x from the knee toward the foot, z up at the zero pose, so outward when standing).
# The sensor frame's x is the beam; pitch turns it from along the tibia to 6 deg short of
# the tibia's z, so standing it looks outward and about 10 deg down.
tof: {x: 0.051, z: 0.0456, pitch: -1.465}
