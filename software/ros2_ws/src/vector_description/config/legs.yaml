# Leg geometry, metres and radians. From the previous hexapod (SPECTRA, const_data.h),
# which matches the measured coxa axle at 52 mm from its mount.
# Leg frame: origin at the coxa axis, x pointing outward, z up.
coxa: 0.051
femur: 0.079
tibia: 0.126

body: {length: 0.28, width: 0.17, thickness: 0.04}

# Hip (coxa axis) position in base_link and the leg's mounting yaw.
mounts:
  L1: {x: 0.1228, y: 0.0698, yaw: 0.7854}
  L2: {x: 0.0, y: 0.1075, yaw: 1.5708}
  L3: {x: -0.1228, y: 0.0698, yaw: 2.3562}
  R1: {x: 0.1228, y: -0.0698, yaw: -0.7854}
  R2: {x: 0.0, y: -0.1075, yaw: -1.5708}
  R3: {x: -0.1228, y: -0.0698, yaw: -2.3562}

limits:
  coxa: [-0.8, 0.8]
  femur: [-1.4, 1.4]
  tibia: [-2.6, 0.3]
  velocity: 7.0   # MG996R at 6 V, roughly 0.14 s / 60 deg
  effort: 1.08    # N·m, MG996R stall at 6 V (11 kg·cm)

# Neutral stance: foot distance from the hip (horizontal) and hip height above ground.
stand:
  reach: 0.116
  height: 0.080

# Mass estimates, kg (2.5 kg total). Coxa servos, battery and electronics sit in the body;
# the femur servo rides on the coxa link, the tibia servo on the femur link.
mass:
  body: 1.45
  coxa_link: 0.070
  femur_link: 0.075
  tibia_link: 0.030

foot_friction: 0.9   # TPU on dirt/wood, rough guess

# VL53L1X on the coxa link, in the coxa link frame (x outward along the link, z up);
# pitch > 0 tips it down. Placeholder until the bracket is drawn.
tof: {x: 0.025, z: -0.015, pitch: 0.35}
