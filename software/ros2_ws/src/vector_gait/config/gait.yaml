gait_node:
  ros__parameters:
    gait: tripod        # tripod, ripple or wave (switch only while standing)
    period: 1.0         # s per full cycle, tripod
    ripple_period: 1.0  # s, ripple
    wave_period: 2.0    # s, wave: one leg at a time needs the longer cycle to stay under the servo speed
    step_height: 0.035  # m
    max_stride: 0.06    # m
    accel: 0.25         # m/s², ramp for starts, stops and direction changes
    turn_accel: 1.5     # rad/s²
    rate: 200.0         # Hz
    cmd_timeout: 0.0    # s without cmd_vel before stopping; 0 = latch the last key, 0.6 = hold-to-move
    height_step: 0.005  # m per t/b press (cmd_vel with only linear.z)
    height_min: -0.005  # m, limits for that height offset; below ~95 mm hip height the femur
    height_max: 0.03    # and tibia hit their limits while walking (gait_report)
    # body offset from the walking frame, m and rad; ramped, can be set live
    body_x: 0.0
    body_y: 0.0
    body_z: 0.0
    body_roll: 0.0
    body_pitch: 0.0
    body_yaw: 0.0
    # IMU leveling: feed body tilt back into roll/pitch (needs /imu)
    level: false
    level_gain: 2.0     # 1/s
    level_max: 0.3      # rad
    # Sentinel Stance: the feet step out to sentinel_reach (wave order, five legs carrying), then
    # the hip goes down to sentinel_height, just above where the belly (bottom plate, ~29 mm
    # below the femur axis) touches; 140 mm is the narrowest reach that gets there with 5 deg
    # of femur margin. Then how long to wait for the legs to power back up.
    sentinel_height: 0.03
    sentinel_reach: 0.14
    power_timeout: 10.0
    # Touchdown: plant each foot where it meets the ground
    touchdown: false
    contact_from: position  # position: measured foot higher than commanded (pots); load: joint torque
    contact_height: 0.003   # m, for position: above the highest commanded height of the last 40 ms
    probe_depth: 0.02       # m below nominal ground a foot may search
    touch_after: 0.7        # only the last 30 % of a swing can end it (the leg's own swing loads it too)
    contact_threshold: 0.6  # N·m, for load: femur + tibia; swing ~0.1, stance ~1.6 in Gazebo
